services:
  postgres:
    image: postgres:17
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
    ports:
      - "55432:5432"
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    volumes:
      - taskflow-redis-data:/data
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: taskflow-grafana
    ports:
      - "3000:3000"
    volumes:
      - taskflow-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  taskflow-postgres-data:
  taskflow-redis-data:
  taskflow-grafana-data: