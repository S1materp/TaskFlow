name: Python Playwright E2E

on:
  push:
    branches: [main, feature/python-qa-automation]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow123
        ports: [ "55432:5432" ]
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=55432;Database=taskflow;Username=taskflow;Password=taskflow123
      TASKFLOW_DATABASE_URL: postgresql://taskflow:taskflow123@127.0.0.1:55432/taskflow
      TASKFLOW_API_URL: http://127.0.0.1:5019
      TASKFLOW_FRONTEND_URL: http://127.0.0.1:5173
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taskflow-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build TaskFlow.Api/TaskFlow.Api.csproj --configuration Release
      - run: dotnet tool install --global dotnet-ef --version '9.*'
      - run: dotnet ef database update --project TaskFlow.Api
      - name: Start backend
        run: dotnet run --project TaskFlow.Api --no-launch-profile --no-build --configuration Release --urls http://127.0.0.1:5019 > /tmp/taskflow-api.log 2>&1 &
      - name: Install and start frontend
        working-directory: taskflow-client
        run: |
          npm ci
          VITE_API_URL=http://127.0.0.1:5019/api/tasks npm run dev -- --host 127.0.0.1 > /tmp/taskflow-ui.log 2>&1 &
      - name: Install Python and Chromium
        run: |
          python -m pip install -r qa-tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Wait for API and frontend readiness
        run: |
          python - <<'PY'
          import time
          import urllib.request

          for url in ("http://127.0.0.1:5019/health", "http://127.0.0.1:5019/api/tasks", "http://127.0.0.1:5173/"):
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as response:
                          if response.status == 200:
                              print(f"Ready: {url}")
                              break
                  except Exception:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit(f"Service not ready: {url}")
          PY
      - name: Run browser E2E tests
        run: python -m pytest -c qa-tests/pytest.ini qa-tests/tests/test_ui.py -v --junitxml=e2e-results.xml
      - name: Print application logs on failure
        if: failure()
        run: |
          cat /tmp/taskflow-api.log || true
          cat /tmp/taskflow-ui.log || true
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-e2e-results
          path: e2e-results.xml
          if-no-files-found: ignore
